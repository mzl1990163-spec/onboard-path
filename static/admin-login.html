<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录管理后台 - OnboardPath</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#1e293b}.card{width:min(430px,calc(100vw - 32px));background:#fff;border-radius:18px;padding:34px;box-shadow:0 24px 70px rgba(0,0,0,.28)}.brand{text-align:center;margin-bottom:28px}.brand .icon{font-size:42px}.brand h1{margin:8px 0 6px;font-size:25px}.brand p{margin:0;color:#64748b;font-size:14px}.field{margin-bottom:17px}.field label{display:block;font-size:13px;font-weight:700;color:#475569;margin-bottom:7px}.field input{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px 13px;font:inherit}.field input:focus{outline:0;border-color:#0284c7;box-shadow:0 0 0 3px rgba(2,132,199,.12)}button{width:100%;border:0;border-radius:10px;background:#0284c7;color:#fff;font-weight:700;font-size:15px;padding:12px;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.hint{font-size:12px;color:#64748b;line-height:1.6;margin:18px 0 0;padding-top:16px;border-top:1px solid #e2e8f0}.error{display:none;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:16px}.back{display:block;text-align:center;margin-top:18px;color:#64748b;text-decoration:none;font-size:13px}.back:hover{color:#0284c7}
</style>
</head>
<body><main class="card">
 <div class="brand"><div class="icon">🧭</div><h1>OnboardPath 管理后台</h1><p>本地管理员和已授权的 LDAP 管理员均可登录</p></div>
 <div id="error" class="error"></div>
 <form id="loginForm">
  <div class="field"><label for="username">用户名</label><input id="username" autocomplete="username" required autofocus></div>
  <div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required></div>
  <button id="submit" type="submit">登录管理后台</button>
 </form>
 <p class="hint">本地用户使用系统密码；LDAP 管理员使用 LDAP 密码。LDAP 用户必须先由超级管理员添加并授权，才能登录后台。</p>
 <a class="back" href="/">返回员工端</a>
</main>
<script>
const form=document.getElementById('loginForm'),errorBox=document.getElementById('error'),submit=document.getElementById('submit');
form.addEventListener('submit',async event=>{event.preventDefault();errorBox.style.display='none';submit.disabled=true;submit.textContent='正在验证…';try{const response=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'登录失败');location.href='/admin'}catch(error){errorBox.textContent=error.message;errorBox.style.display='block'}finally{submit.disabled=false;submit.textContent='登录管理后台'}});
</script></body></html>
