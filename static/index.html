<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队办公自助办理与导航手册</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            font-size: 16px;
            min-height: 100vh;
        }

        /* ================= 1. 前置信息录入界面样式 ================= */
        .welcome-onboarding-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 20px;
        }

        .onboarding-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 520px;
            padding: 48px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            animation: fadeInScale 0.3s ease-in-out;
        }

        .onboarding-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .onboarding-header .icon {
            font-size: 54px;
            margin-bottom: 12px;
            display: inline-block;
        }

        .onboarding-header h2 {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .onboarding-header p {
            font-size: 15px;
            color: #64748b;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .form-group label span {
            color: #ef4444;
            margin-left: 4px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            background-color: #f8fafc;
            color: #0f172a;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: #0284c7;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }

        select.form-control {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%3c64748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 18px;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 12px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.4);
        }

        /* ================= 2. 主界面（Dashboard & 文档） ================= */
        .main-app-container {
            display: none; /* 初始隐藏，提交后再显示 */
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            padding: 24px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
            z-index: 10;
            flex-shrink: 0;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        header h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(90deg, #ffffff 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-welcome-badge {
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 500;
        }

        /* 一级导航 */
        .top-category-nav {
            background-color: #ffffff;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            width: 100%;
            flex-shrink: 0;
        }

        .top-tab {
            flex: 1;
            padding: 18px 20px;
            font-size: 16.5px;
            font-weight: 600;
            color: #64748b;
            background: none;
            border: none;
            border-bottom: 4px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .top-tab:hover {
            color: #0284c7;
            background-color: #f1f5f9;
        }

        .top-tab.active {
            color: #0284c7;
            border-bottom-color: #0284c7;
            background-color: #f8fafc;
            font-weight: 700;
        }

        .top-tab.home-tab {
            flex: 0 0 150px;
            background-color: #f1f5f9;
            border-right: 1px solid #e2e8f0;
        }

        .top-tab.home-tab.active {
            background-color: #e0f2fe;
            color: #0369a1;
        }

        /* 主体布局 */
        .content-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* 首页 Dashboard */
        .dashboard-container {
            display: none;
            width: 100%;
            height: 100%;
            padding: 40px 60px;
            overflow-y: auto;
            background-color: #f8fafc;
        }

        .dashboard-container.active {
            display: block;
            animation: fadeIn 0.25s ease-in-out;
        }

        .dash-max-width {
            max-width: 1400px;
            margin: 0 auto;
        }

        .dash-welcome-card {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            padding: 36px 44px;
            border-radius: 16px;
            margin-bottom: 32px;
        }

        .dash-welcome-card h2 {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ffffff 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dash-welcome-card p {
            font-size: 17px;
            color: #94a3b8;
            line-height: 1.6;
        }

        /* 模块四大卡片 */
        .dash-section-title {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
        }

        .dash-cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 36px;
        }

        .dash-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dash-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
            border-color: #38bdf8;
        }

        .dash-card-icon {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .dash-card h3 {
            font-size: 19px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .dash-card p {
            font-size: 14.5px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .dash-card-btn {
            font-size: 14.5px;
            font-weight: 600;
            color: #0284c7;
        }

        /* 双栏文档视图 */
        .doc-view-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .left-sidebar {
            width: 360px;
            background-color: #ffffff;
            border-right: 1px solid #e2e8f0;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .step-list-group {
            display: none;
        }

        .step-list-group.active {
            display: block;
        }

        .step-item {
            padding: 16px 24px;
            font-size: 15.5px;
            color: #334155;
            cursor: pointer;
            border-left: 4px solid transparent;
            border-bottom: 1px solid #f1f5f9;
            transition: all 0.15s ease;
        }

        .step-item:hover {
            background-color: #f1f5f9;
            color: #0284c7;
        }

        .step-item.active {
            background-color: #e0f2fe;
            color: #0369a1;
            font-weight: 600;
            border-left-color: #0284c7;
        }

        .step-item.intro-item {
            background-color: #f8fafc;
            font-weight: 600;
        }

        .right-content {
            flex: 1;
            padding: 40px 60px;
            background-color: #ffffff;
            overflow-y: auto;
        }

        .doc-panel {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
        }

        .doc-panel.active {
            display: block;
            animation: fadeIn 0.2s ease-in-out;
        }

        .panel-header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e2e8f0;
        }

        .panel-header h3 {
            font-size: 26px;
            color: #0f172a;
            font-weight: 700;
        }

        .code-box {
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            color: #0369a1;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-message { display:none; margin-bottom:18px; padding:14px 16px; border-radius:10px; font-size:14px; line-height:1.7; }
        .login-message.error { display:block; background:#fef2f2; border:1px solid #fecaca; color:#991b1b; }
        .login-message.expired { display:block; background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; }
        .login-message strong { display:block; font-size:16px; margin-bottom:5px; }
        .login-message a { color:#0369a1; font-weight:700; }
        .admin-preview-banner { display:none; margin-bottom:16px; padding:10px 13px; border-radius:9px; background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af; font-size:13px; }
    </style>
</head>
<body>

    <!-- ================= 页面一：个人信息登记入口 ================= -->
    <div id="onboarding-page" class="welcome-onboarding-wrapper">
        <div class="onboarding-card">
            <div class="onboarding-header">
                <span class="icon">👋</span>
                <h2 id="loginWelcomeTitle">欢迎新同事加入！</h2>
                <p id="loginWelcomeSubtitle">在开始办理入职配置前，请先登记您的基础个人信息</p>
            </div>

            <div id="loginMessage" class="login-message"></div>
            <form id="user-info-form" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label id="userNameLabel" for="userName">姓名（全拼）<span>*</span></label>
                    <input type="text" id="userName" class="form-control" placeholder="请输入姓名全拼，例如 zhangsan" required>
                </div>

                <div class="form-group" id="adminPasswordGroup" style="display:none">
                    <label for="adminPassword">管理员密码 <span>*</span></label>
                    <input type="password" id="adminPassword" class="form-control" autocomplete="current-password">
                </div>

                <div class="form-group">
                    <label for="userDept">所属部门 <span>*</span></label>
                    <select id="userDept" class="form-control" required><option value="">正在加载部门...</option></select>
                </div>

                <div class="form-group">
                    <label for="userRole">入职岗位/职位 <span>*</span></label>
                    <select id="userRole" class="form-control" required><option value="">请先选择部门</option></select>
                </div>

                <button type="submit" class="btn-submit" id="loginSubmitText">开启我的入职指南 ➔</button>
            </form>
        </div>
    </div>
    <!-- JavaScript 交互逻辑 -->
    <script>
    let departments = [];
    let publicConfig = {};
    let adminLoginMode = false;
    const deptSelect = document.getElementById('userDept');
    const roleSelect = document.getElementById('userRole');
    const safeBgUrl = value => value && (/^https?:\/\//i.test(value) || value.startsWith('/uploads/')) ? value.replace(/["\\]/g, '') : '';
    const hexToRgba = (hex, opacity) => {
        const value = /^#[0-9a-f]{6}$/i.test(hex || '') ? hex.slice(1) : '0f172a';
        const r = parseInt(value.slice(0, 2), 16), g = parseInt(value.slice(2, 4), 16), b = parseInt(value.slice(4, 6), 16);
        return `rgba(${r},${g},${b},${Math.min(100, Math.max(0, Number(opacity) || 0)) / 100})`;
    };

    fetch('/api/public/config')
        .then(response => {
            if (!response.ok) throw new Error('配置加载失败');
            return response.json();
        })
        .then(data => {
            const cfg = data.config || {};
            publicConfig = cfg;
            const page = document.getElementById('onboarding-page');
            page.style.backgroundColor = cfg.login_bg_color || '#0f172a';
            const backgroundUrl = safeBgUrl(cfg.login_bg_url);
            page.style.backgroundImage = backgroundUrl
                ? `linear-gradient(${hexToRgba(cfg.login_overlay_color, cfg.login_overlay_opacity)}, ${hexToRgba(cfg.login_overlay_color, cfg.login_overlay_opacity)}), url("${backgroundUrl}")`
                : 'none';
            page.style.backgroundSize = 'cover';
            page.style.backgroundPosition = 'center';
            document.getElementById('loginWelcomeTitle').textContent = cfg.login_welcome_title || '欢迎新同事加入！';
            document.getElementById('loginWelcomeSubtitle').textContent = cfg.login_welcome_subtitle || '';
            document.getElementById('loginSubmitText').textContent = cfg.login_button_text || '开启我的入职指南 ➔';
            departments = data.departments || [];
            deptSelect.innerHTML = '<option value="">请选择部门</option>';
            departments.forEach(dept => {
                const option = document.createElement('option');
                option.value = dept.id;
                option.textContent = dept.name;
                deptSelect.appendChild(option);
            });
        })
        .catch(() => {
            deptSelect.innerHTML = '<option value="">部门加载失败，请刷新重试</option>';
        });

    deptSelect.addEventListener('change', () => {
        const dept = departments.find(item => String(item.id) === deptSelect.value);
        roleSelect.innerHTML = '<option value="">请选择岗位</option>';
        if (!dept) return;
        dept.positions.forEach(position => {
            const option = document.createElement('option');
            option.value = position.id;
            option.textContent = position.name;
            roleSelect.appendChild(option);
        });
    });

    function showLoginMessage(message, type='error', title='') {
        const box = document.getElementById('loginMessage');
        box.className = `login-message ${type}`;
        box.innerHTML = '';
        if (title) { const strong = document.createElement('strong'); strong.textContent = title; box.appendChild(strong); }
        const text = document.createElement('span'); text.textContent = message; box.appendChild(text);
        return box;
    }

    function activateAdminLogin() {
        adminLoginMode = true;
        document.getElementById('adminPasswordGroup').style.display = 'block';
        document.getElementById('adminPassword').required = true;
        document.getElementById('userNameLabel').innerHTML = '管理员用户名 <span>*</span>';
        document.getElementById('userName').placeholder = '请输入管理员用户名';
    }

    document.getElementById('userName').addEventListener('input', () => {
        if (!adminLoginMode) return;
        adminLoginMode = false;
        document.getElementById('adminPasswordGroup').style.display = 'none';
        document.getElementById('adminPassword').required = false;
        document.getElementById('adminPassword').value = '';
        document.getElementById('userNameLabel').innerHTML = '姓名（全拼）<span>*</span>';
        document.getElementById('userName').placeholder = '请输入姓名全拼，例如 zhangsan';
        document.getElementById('loginMessage').className = 'login-message';
    });

    async function handleFormSubmit(event) {
        event.preventDefault();
        const username = document.getElementById('userName').value.trim();
        const positionId = Number(roleSelect.value);
        const dept = departments.find(item => String(item.id) === deptSelect.value);
        const position = dept?.positions.find(item => item.id === positionId);

        if (!username || !dept || !position) {
            showLoginMessage('请完整填写姓名全拼、部门和岗位。');
            return;
        }
        const submit = document.getElementById('loginSubmitText');
        submit.disabled = true;
        const originalText = submit.textContent;
        submit.textContent = '正在验证…';
        try {
            const endpoint = adminLoginMode ? '/api/public/admin-preview-login' : '/api/public/verify-account';
            const payload = adminLoginMode
                ? {username, password: document.getElementById('adminPassword').value, position_id: positionId}
                : {username, position_id: positionId};
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            if (!response.ok) {
                if (response.status === 409 && !adminLoginMode) activateAdminLogin();
                showLoginMessage(result.detail || '验证失败，请稍后重试');
                return;
            }
            if (!result.pass && result.expired) {
                const box = showLoginMessage(result.msg || '您的新员工入职指引访问期限已结束。', 'expired', result.title || '入职指引访问期已结束');
                if (result.dingtalk_url) {
                    box.appendChild(document.createTextNode(' '));
                    const link = document.createElement('a');
                    link.href = result.dingtalk_url;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.textContent = result.dingtalk_text || '钉钉服务台';
                    box.appendChild(link);
                }
                return;
            }
            if (!result.pass) {
                showLoginMessage(result.msg || '验证失败，请稍后重试');
                return;
            }

            sessionStorage.setItem('userInfo', JSON.stringify({
                username: result.display_name || username,
                positionId,
                departmentName: dept.name,
                positionName: position.name,
                adminPreview: Boolean(result.admin_preview)
            }));
            window.location.href = '/steps';
        } catch (error) {
            showLoginMessage(publicConfig.employee_service_error_message || '暂时无法连接服务器，请稍后重试');
        } finally {
            submit.disabled = false;
            submit.textContent = originalText;
        }
    }
</script>
</body>
</html>
